services:
  api:
    build:
      context: .
    container_name: agent_ticket_api
    working_dir: /app
    command: uvicorn Api.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-agent_ticket}
    volumes:
      - .:/app
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: agent_ticket_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agent_ticket}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

# Iniciar API:
# docker compose -f ambiente.yaml up --build
#
# Se a porta 8000 estiver ocupada:
# API_PORT=8001 docker compose -f ambiente.yaml up --build
#
# Se a porta 5432 do Postgres estiver ocupada:
# POSTGRES_PORT=5433 docker compose -f ambiente.yaml up --build
#
# Se as duas portas estiverem ocupadas:
# API_PORT=8001 POSTGRES_PORT=5433 docker compose -f ambiente.yaml up --build

# Conectar no container:
# docker exec -it agent_ticket_api bash

# Conectar no Postgres:
# docker exec -it agent_ticket_postgres psql -U postgres -d agent_ticket

# Desligar ambiente:
# docker compose -f ambiente.yaml down

